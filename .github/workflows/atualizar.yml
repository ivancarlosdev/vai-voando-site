name: Atualizar ofertas

on:
  schedule:
    - cron: "17 9 * * *" # todo dia, 06h17 no horário de Brasília
  workflow_dispatch: # permite rodar na hora pelo botão "Run workflow"

permissions:
  contents: write

concurrency:
  group: atualizar-ofertas
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar o navegador
        run: npx playwright install --with-deps chromium

      - name: Ler as ofertas do portal
        run: node scripts/atualizar.mjs

      - name: Salvar as mudanças
        run: |
          git config user.name "Robô Vai Voando"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Sem mudanças hoje."
          else
            git commit -m "Atualiza ofertas de $(date -u +%F)"
            git push
          fi
